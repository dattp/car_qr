name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: QR-Generator-macOS
            zip_cmd: |
              cd dist
              zip -ry "../QR-Generator-macOS.zip" "QR Generator.app"
            asset_path: QR-Generator-macOS.zip
          - os: windows-latest
            artifact_name: QR-Generator-Windows
            zip_cmd: |
              cd dist
              7z a "../QR-Generator-Windows.zip" "QR Generator"
            asset_path: QR-Generator-Windows.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --name "QR Generator" \
            --hidden-import qrgen --hidden-import qrgen.app --hidden-import qrgen.core \
            main.py

      - name: Package
        shell: bash
        run: ${{ matrix.zip_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_path }}
